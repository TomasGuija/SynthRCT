# Phase-conditioned g070-to-target training through the inference-time prior.
trainer:
  profiler: simple
  precision: bf16-mixed
  max_epochs: 500
  accelerator: gpu
  devices: 1
  log_every_n_steps: 20
  check_val_every_n_epoch: 1
  default_root_dir: runs/SynthRCTPhasePriorOnly

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss_total
        mode: min
        save_top_k: 1
        filename: best

    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        save_top_k: 0

    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs
      name: SynthRCTPhasePriorOnly

data:
  h5_path: data/TCIA4DLung_288x256x256.h5
  val_case_ids: [0]
  reference_time_id: 7

  slab_size: 48
  stitch_stride: null
  num_sampled_regions: 4
  min_scan_distance: 2

  batch_size: 1
  num_workers: 2
  prefetch_factor: 1
  pin_memory: false
  shuffle: true
  persistent_workers: false

model:
  slab_size: 48
  stitch_stride: null

  base_ch: 16
  n_levels: 4
  out_channels: 3
  convs_per_block: 1
  latent_dim: 32
  condition_on_phase: true

  svf_steps: 7

  sim_weight: 10.0
  kl_weight: 0.0
  prior_kl_weight: 0.0

  deep_supervision_scales: [8, 4, 2]
  deep_supervision_weights: [0.025, 0.05, 0.1]

  kl_start_epoch: 0
  kl_warmup_epochs: 0

  lr: 1.0e-4
  weight_decay: 1.0e-4
